name: publish

# Builds the image and pushes it to the registry. It does not touch the server.
# Deploying is a separate act you perform yourself with ./deploy.sh, which is
# why nothing here needs an SSH key or any other secret: the only credential
# involved is GITHUB_TOKEN, which GitHub mints per run and discards.
#
# Manual only. A push to main publishes nothing.
on:
  workflow_dispatch:

concurrency:
  group: publish-paralx
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/paralx

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: the backend must build and vet clean
        working-directory: backend
        run: go vet ./... && go build -o /dev/null ./

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          # Both tags point at the same build. `latest` is what the server
          # pulls; the sha tag is what you roll back to.
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

      # The Go binary serves the frontend out of ./dist. If that stage produced
      # nothing the container is perfectly healthy and serves 404 to everyone.
      # Look inside the artefact before it is treated as deployable.
      - name: the image must contain both the binary and the built frontend
        run: |
          docker pull -q "${IMAGE}:${GITHUB_SHA}"
          cid=$(docker create "${IMAGE}:${GITHUB_SHA}")
          trap 'docker rm -f "$cid" >/dev/null' EXIT
          docker cp "$cid:/app/dist" /tmp/dist
          [ -s /tmp/dist/index.html ] || { echo "no index.html in the image"; exit 1; }
          # Deliberately not looking in a named assets directory. Astro's
          # default is _astro, this project sets build.assets to _assets, and a
          # guard that hard-codes either one fails on a perfectly good build.
          # What actually matters is that the bundler emitted something.
          pages=$(find /tmp/dist -name '*.html' | wc -l)
          assets=$(find /tmp/dist \( -name '*.js' -o -name '*.css' \) | wc -l)
          echo "$pages pages, $assets script and style files"
          [ "$pages" -ge 1 ] || { echo "no pages: the frontend build is incomplete"; exit 1; }
          [ "$assets" -ge 1 ] || { echo "no js or css: the frontend build is incomplete"; exit 1; }

      - name: what to run next
        run: |
          echo "Published ${IMAGE}:${GITHUB_SHA}"
          echo "Deploy it with:  ./deploy.sh"
