services:
    db:
        image: postgres:17
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        volumes:
            - pgdata:/var/lib/postgresql/data
        restart: unless-stopped

    backend:
        # context project root because need access to frontend/
        build:
            context: ./
            dockerfile: backend/Dockerfile
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - certs:/certs
        environment:
            FRED_API_KEY: ${FRED_API_KEY}
            DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
        depends_on:
            - db
        # not `always` to allow for docker compose stop
        restart: unless-stopped

# declares that cert needs to be created and managed by docker on the server
volumes:
    certs:
    pgdata:
